name: Decompile Large APK to Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать текущий репозиторий
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Найти APK файлы в репозитории
        id: find_apk
        run: |
          echo "Поиск APK файлов в репозитории..."
          APK_FILES=$(find . -name "*.apk" -type f | grep -v "output_apktool" | grep -v "output_jadx" || true)
          
          if [ -z "$APK_FILES" ]; then
            echo "::error::APK файлы не найдены в репозитории"
            echo "Содержимое корня:"
            ls -la
            exit 1
          fi
          
          echo "Найдены APK файлы:"
          echo "$APK_FILES"
          
          # Берем первый найденный APK
          APK_PATH=$(echo "$APK_FILES" | head -n 1)
          echo "Используемый файл: $APK_PATH"
          
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          
          echo "Информация о файле:"
          ls -lh "$APK_PATH"
          file "$APK_PATH"

      - name: Проверить валидность APK
        run: |
          APK="${{ steps.find_apk.outputs.apk_path }}"
          if ! file "$APK" | grep -q "Zip archive data"; then
            echo "::error::Файл $APK не является валидным APK/ZIP архивом"
            head -c 500 "$APK"
            exit 1
          fi

      - name: Очистить старые папки декомпиляции
        run: |
          git rm -rf --cached output_apktool output_jadx || true
          rm -rf output_apktool output_jadx

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установить apktool и jadx
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          wget https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          wget https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip -O jadx.zip
          unzip -q jadx.zip -d jadx-bin
          chmod +x jadx-bin/bin/jadx

      - name: Декомпиляция через apktool
        run: java -jar apktool.jar d "${{ steps.find_apk.outputs.apk_path }}" -o output_apktool -f

      - name: Декомпиляция через jadx
        env:
          JAVA_OPTS: "-Xmx6g"
        run: jadx-bin/bin/jadx -j 4 -d output_jadx "${{ steps.find_apk.outputs.apk_path }}"

      - name: Закоммитить и отправить папки в репозиторий
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output_apktool output_jadx
          git commit -m "chore: обновить результаты декомпиляции APK" || echo "Нет изменений для коммита"
          git push

      - name: Очистить временные файлы
        run: rm -rf jadx.zip jadx-bin apktool.jar
