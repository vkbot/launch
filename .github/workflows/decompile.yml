name: Decompile Large APK to Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать текущий репозиторий
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Найти APK файлы в репозитории
        id: find_apk
        run: |
          echo "Поиск APK файлов в репозитории..."
          # Ищем все APK, исключая папки с результатами декомпиляции
          APK_FILES=$(find . -name "*.apk" -type f \
            | grep -v "output_apktool" \
            | grep -v "output_jadx" || true)
          
          if [ -z "$APK_FILES" ]; then
            echo "::error::APK файлы не найдены в репозитории"
            ls -la
            exit 1
          fi
          
          echo "Найдены APK файлы:"
          echo "$APK_FILES"
          
          # Берём самый большой APK (обычно это и есть целевой)
          APK_PATH=$(echo "$APK_FILES" | xargs ls -S | head -n 1)
          echo "Используемый файл: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          
          ls -lh "$APK_PATH"

      - name: Проверить валидность APK
        run: |
          APK="${{ steps.find_apk.outputs.apk_path }}"
          
          # Проверка 1: размер файла должен быть > 0
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Файл $APK слишком мал ($SIZE байт), вероятно повреждён"
            exit 1
          fi
          
          # Проверка 2: сигнатура ZIP (PK\x03\x04) в первых байтах
          MAGIC=$(head -c 4 "$APK" | od -An -tx1 | tr -d ' ')
          echo "Сигнатура файла: $MAGIC"
          if [ "$MAGIC" != "504b0304" ] && [ "$MAGIC" != "504b0506" ]; then
            echo "::error::Файл $APK не имеет сигнатуры ZIP/APK"
            head -c 200 "$APK" | xxd
            exit 1
          fi
          
          # Проверка 3: unzip может прочитать список файлов
          if ! unzip -l "$APK" > /dev/null 2>&1; then
            echo "::error::unzip не может прочитать архив $APK"
            exit 1
          fi
          
          echo "✓ Файл валиден, содержит $(unzip -l "$APK" | tail -1 | awk '{print $2}') файлов"

      - name: Очистить старые папки декомпиляции
        run: |
          git rm -rf --cached output_apktool output_jadx || true
          rm -rf output_apktool output_jadx

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установить apktool и jadx
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          wget https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          wget https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip -O jadx.zip
          unzip -q jadx.zip -d jadx-bin
          chmod +x jadx-bin/bin/jadx

      - name: Декомпиляция через apktool
        run: java -jar apktool.jar d "${{ steps.find_apk.outputs.apk_path }}" -o output_apktool -f

      - name: Декомпиляция через jadx
        env:
          JAVA_OPTS: "-Xmx6g"
        run: jadx-bin/bin/jadx -j 4 -d output_jadx "${{ steps.find_apk.outputs.apk_path }}"

      - name: Закоммитить и отправить папки в репозиторий
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output_apktool output_jadx
          git commit -m "chore: обновить результаты декомпиляции APK" || echo "Нет изменений для коммита"
          git push

      - name: Очистить временные файлы
        run: rm -rf jadx.zip jadx-bin apktool.jar
